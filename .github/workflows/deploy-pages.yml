name: Redirect archived Tinymods mirror to tinymods.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare redirect-only website
        run: |
          mkdir -p .pages-redirect
          cp redirect/index.html .pages-redirect/index.html
          cp redirect/index.html .pages-redirect/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect-only Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
